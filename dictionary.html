<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self'">
<title>Youdao — Capdio</title>
<link rel="stylesheet" href="src/App.css">
<style>
body { min-width: 0; background: var(--app-bg); }
.app-menu__items button { display: grid; place-items: center; }
.app-menu__items svg { width: 16px; height: 16px; }
</style>
</head>
<body class="app-frame app-frame--dark">
<script>document.body.classList.toggle("app-frame--dark", new URLSearchParams(location.search).get("theme") !== "light");</script>
<header class="app-menu" aria-label="Dictionary menu">
  <div class="app-menu__brand"><img src="assets/capdio-icon.png" alt="Capdio" draggable="false"></div>
  <nav class="app-menu__items" aria-label="History">
    <button id="back" title="Back (Alt+Left)" aria-label="Back" aria-keyshortcuts="Alt+ArrowLeft" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 19-7-7 7-7M5 12h14"/></svg></button>
    <button id="forward" title="Forward (Alt+Right)" aria-label="Forward" aria-keyshortcuts="Alt+ArrowRight" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m12 5 7 7-7 7M5 12h14"/></svg></button>
    <button id="theme" title="Toggle colour theme (Ctrl+Shift+T)" aria-label="Toggle colour theme" aria-keyshortcuts="Control+Shift+T"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 3a9 9 0 1 0 9 9 7 7 0 0 1-9-9Z"/></svg></button>
  </nav>
  <div class="app-menu__window-controls" aria-label="Window controls">
    <button id="minimize" title="Minimize" aria-label="Minimize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M5 12h14"/></svg></button>
    <button id="maximize" title="Maximize or restore" aria-label="Maximize or restore"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
    <button id="close" class="app-menu__close" title="Close" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m18 6-12 12M6 6l12 12"/></svg></button>
  </div>
</header>
<script>
const { ipcRenderer } = require('electron');
ipcRenderer.on('dictionary-theme', (event, dark) => {
    document.body.classList.toggle('app-frame--dark', dark);
});
for (const action of ['back', 'forward', 'theme', 'minimize', 'maximize', 'close']) {
    document.getElementById(action).onclick = () => ipcRenderer.send('dictionary-control', action);
}
ipcRenderer.on('dictionary-navigation', (event, state) => {
    document.getElementById('back').disabled = !state.back;
    document.getElementById('forward').disabled = !state.forward;
});
</script>
</body>
</html>
